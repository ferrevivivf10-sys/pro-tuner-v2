name: Build Android APK

# Compila um APK de debug (instalavel direto, sem assinatura de release) na
# nuvem do GitHub — nao precisa de PC, conta Expo nem token.
# - Roda automaticamente a cada push nesta branch de trabalho.
# - Ou dispare manualmente: aba "Actions" > "Build Android APK" > "Run workflow".
# Ao terminar, baixe o APK em "Artifacts" na pagina da execucao.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/unused-files-obsolete-functions-qscu8c
    paths-ignore:
      - "**/*.md"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O runner ubuntu-latest ja traz o Android SDK (ANDROID_HOME/licencas
      # aceitas); o Gradle baixa build-tools/NDK que faltarem por conta propria.

      - name: Install dependencies
        run: npm install

      - name: Prebuild (gera o projeto android/)
        run: npx expo prebuild --platform android --no-install

      # Release embute o bundle JS no APK (roda sozinho, sem Metro). O Expo
      # configura o release assinado com a debug key, entao instala direto.
      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pro-tuner-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
