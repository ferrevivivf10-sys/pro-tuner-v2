name: Build Android APK

# Compila um APK de release na nuvem do GitHub — nao precisa de PC, conta
# Expo nem token. O release embute o bundle JS, entao o app roda sozinho
# (sem Metro), e e assinado com a debug key do Expo, entao instala direto.
# - Roda automaticamente a cada push na main (ignorando mudancas so de .md).
# - E tambem pode ser disparado manualmente em qualquer branch:
#   aba "Actions" > "Build Android APK" > "Run workflow".
# Ao terminar, baixe o APK em "Artifacts" na pagina da execucao.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historico completo: a versao conta os commits

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O runner ubuntu-latest ja traz o Android SDK (ANDROID_HOME/licencas
      # aceitas); o Gradle baixa build-tools/NDK que faltarem por conta propria.

      - name: Versao
        id: version
        run: echo "name=$(node scripts/version.js)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      # Para o build se o detector de notas quebrar
      - name: Testes
        run: npm test

      - name: Prebuild (gera o projeto android/)
        run: npx expo prebuild --platform android --no-install

      # Release embute o bundle JS no APK (roda sozinho, sem Metro). O Expo
      # configura o release assinado com a debug key, entao instala direto.
      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Gerar CHANGELOG.md
        run: node scripts/changelog.js

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pro-tuner-v${{ steps.version.outputs.name }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            CHANGELOG.md
          if-no-files-found: error

      # So na main: salva o CHANGELOG.md no repositorio
      - name: Commit do CHANGELOG.md
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: changelog v${{ steps.version.outputs.name }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
